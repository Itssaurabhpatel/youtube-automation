name: Upload from Google Drive (Auto Title, Desc & Tags)

on:
  workflow_dispatch:
    inputs:
      drive_url:
        description: "Google Drive File or Folder Link (Make sure sharing is set to 'Anyone with link')"
        required: true
        type: string
      privacy:
        description: "YouTube Privacy"
        required: true
        type: choice
        options:
          - private
          - unlisted
          - public
        default: private

permissions:
  contents: read

jobs:
  drive-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Download from Drive, Auto-Generate Metadata and Upload
        env:
          PYTHONIOENCODING: utf-8
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/drive_upload.py \
            --url "${{ inputs.drive_url }}" \
            --privacy "${{ inputs.privacy || 'private' }}"
