name: 100% Auto Hindi YouTube Shorts Generator & Uploader

on:
  schedule:
    # Runs daily at 04:00 UTC (09:30 AM IST)
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: "Custom Topic (leave empty to auto-research latest Hindi news)"
        required: false
        type: string
        default: ""
      provider:
        description: "AI Provider for Script Writing"
        required: true
        type: choice
        options:
          - auto
          - gemini
          - grok
          - claude
        default: auto
      privacy:
        description: "YouTube Privacy"
        required: true
        type: choice
        options:
          - private
          - unlisted
          - public
        default: private

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg & Hindi Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-deva fonts-freefont-ttf

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run 100% Automated Shorts Pipeline
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/pipeline.py \
            --topic "${{ inputs.topic }}" \
            --provider "${{ inputs.provider || 'auto' }}" \
            --privacy "${{ inputs.privacy || 'private' }}"

      - name: Save Generated Video as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-shorts-video
          path: output/*.mp4
          retention-days: 7
