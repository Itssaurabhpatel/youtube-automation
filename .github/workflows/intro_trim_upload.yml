name: Trim & Merge Intro Video (Auto Metadata & Upload)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Main Video Link (Google Drive or Direct Link with 'Anyone with link')"
        required: true
        type: string
      cut_end_seconds:
        description: "Seconds to cut/remove from the END of Main Video"
        required: true
        type: string
        default: "2"
      cut_start_seconds:
        description: "Seconds to cut from the START of Main Video (Optional)"
        required: false
        type: string
        default: "0"
      intro_url:
        description: "Intro Video Link (Optional: leave empty to use 'assets/intro.mp4' from repo)"
        required: false
        type: string
        default: ""
      watermark_mode:
        description: "NotebookLM Watermark Removal Mode"
        required: true
        type: choice
        options:
          - cover_badge
          - delogo
          - none
        default: cover_badge
      logo_url:
        description: "Custom Logo/Pic URL to cover watermark (Optional: leave empty to use assets/logo.png from repo)"
        required: false
        type: string
        default: ""
      thumbnail_style:
        description: "Thumbnail Style (1: Bold Hindi News Maroon, 2: High-Contrast Farming Tips Yellow)"
        required: true
        type: choice
        options:
            - auto
            - "1"
            - "2"
        default: auto
      thumbnail_url:
        description: "Custom Thumbnail Link (Optional: Google Drive link or direct URL. Leave empty for Auto-AI generation)"
        required: false
        type: string
        default: ""
      privacy:
        description: "YouTube Privacy"
        required: true
        type: choice
        options:
          - private
          - unlisted
          - public
        default: private

permissions:
  contents: read

jobs:
  trim-merge-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and Devanagari Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-deva fonts-noto-core fonts-noto-extra fonts-indic

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Trim, Merge Intro, Auto-Generate Metadata and Upload
        env:
          PYTHONIOENCODING: utf-8
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/intro_trim_upload.py \
            --video-url "${{ inputs.video_url }}" \
            --cut-end-seconds "${{ inputs.cut_end_seconds || '2' }}" \
            --cut-start-seconds "${{ inputs.cut_start_seconds || '0' }}" \
            --intro-url "${{ inputs.intro_url }}" \
            --watermark-mode "${{ inputs.watermark_mode || 'cover_badge' }}" \
            --logo-url "${{ inputs.logo_url }}" \
            --thumbnail-style "${{ inputs.thumbnail_style || 'auto' }}" \
            --thumbnail-url "${{ inputs.thumbnail_url }}" \
            --privacy "${{ inputs.privacy || 'private' }}"

      - name: Save Merged Video and Thumbnail as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-video-and-thumbnail
          path: output/*.*
          retention-days: 7
